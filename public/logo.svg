<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="wayapp_icon_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="text_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="20" fill="url(#wayapp_icon_grad)" />
    <rect x="2" y="2" width="76" height="76" rx="18" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
    <path d="M20 28L30 54L40 35L50 54L60 28" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="60" cy="28" r="4.5" fill="#34d399" />
  </g>

  <!-- Typography: WAYAPP -->
  <text x="105" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="url(#text_grad)">
    WAY<tspan fill="#059669">APP</tspan>
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="106" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#64748b">

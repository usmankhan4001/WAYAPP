<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#041512" />
    </linearGradient>
    
    <radialGradient id="glow_emerald" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow_cyan" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Icon Gradient -->
    <linearGradient id="icon_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="480" fill="url(#bg_grad)" rx="16" />
  <rect width="1200" height="480" fill="url(#grid)" rx="16" />
  <rect width="1200" height="480" fill="url(#glow_emerald)" rx="16" />
  <rect width="1200" height="480" fill="url(#glow_cyan)" rx="16" />
  <rect width="1198" height="478" x="1" y="1" rx="15" stroke="url(#border_grad)" stroke-width="1.5" fill="none" />

  <!-- Left Side: Brand & Value Proposition -->
  <g transform="translate(80, 80)">
    <!-- Brand Badge Pill -->
    <g>
      <rect width="260" height="32" rx="16" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#34d399" />
      <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0" letter-spacing="0.5">
        META GRAPH API v21.0 READY
      </text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 58)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
        WAY<tspan fill="#10b981">APP</tspan>
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 105)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#f1f5f9" letter-spacing="-0.3">
        WhatsApp Cloud Broadcast &amp; 2-Way Inbox Platform
      </text>
      <text y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
        Enterprise self-hosted alternative to WATI, Interakt &amp; AiSensy.
      </text>
    </g>

    <!-- Feature Badges -->
    <g transform="translate(0, 180)">
      <!-- Badge 1: 2-Way Live Chat -->
      <g>
        <rect width="130" height="30" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1">⚡ Live 2-Way Chat</text>
      </g>
      <!-- Badge 2: Rate Throttling -->
      <g transform="translate(142, 0)">
        <rect width="145" height="30" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1">🎯 Smart Segmentation</text>
      </g>
      <!-- Badge 3: Dokploy Ready -->
      <g transform="translate(299, 0)">
        <rect width="125" height="30" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1">🐳 Dokploy Ready</text>
      </g>
    </g>

    <!-- Metrics Strip -->
    <g transform="translate(0, 245)">
      <g>
        <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#34d399">20 msgs/s</text>
        <text y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Throttled Engine</text>
      </g>
      <g transform="translate(130, 0)">
        <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#38bdf8">100%</text>
        <text y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Data Privacy (Self-Hosted)</text>
      </g>
      <g transform="translate(300, 0)">
        <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f59e0b">v21.0</text>
        <text y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Official Graph API</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Graphic Representation / Modern UI Card Mockup -->
  <g transform="translate(740, 65)">
    <!-- Glow Backdrop -->
    <circle cx="200" cy="170" r="160" fill="#059669" fill-opacity="0.15" filter="blur(40px)" />
    
    <!-- Main Card -->
    <rect width="380" height="340" rx="16" fill="url(#card_grad)" stroke="#334155" stroke-opacity="0.8" stroke-width="1.5" />
    
    <!-- Card Header -->
    <g transform="translate(20, 20)">
      <!-- Big Logo Squircle -->
      <rect width="52" height="52" rx="14" fill="url(#icon_grad)" />
      <rect x="1" y="1" width="50" height="50" rx="13" stroke="#6ee7b7" stroke-width="1" stroke-opacity="0.5" fill="none" />
      <path d="M12 18L18 34L26 22L34 34L40 18" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="40" cy="18" r="3" fill="#34d399" />

      <g transform="translate(68, 8)">
        <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff">WAYAPP Control Center</text>
        <text y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#34d399">● Live Webhook Engine Connected</text>
      </g>
    </g>

    <!-- Simulated Stats Cards -->
    <g transform="translate(20, 95)">
      <!-- Stat 1 -->
      <rect width="162" height="68" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">DELIVERY RATE</text>
      <text x="14" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#34d399">99.4%</text>

      <!-- Stat 2 -->
      <g transform="translate(178, 0)">
        <rect width="162" height="68" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">READ RATE</text>
        <text x="14" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#38bdf8">74.2%</text>
      </g>
    </g>

    <!-- Simulated WhatsApp Message Bubble -->
    <g transform="translate(20, 185)">
      <rect width="340" height="130" rx="12" fill="#064e3b" fill-opacity="0.35" stroke="#059669" stroke-opacity="0.4" stroke-width="1" />
      
      <!-- Verified Badge -->
      <g transform="translate(14, 16)">
        <circle cx="8" cy="8" r="8" fill="#10b981" />
        <path d="M5 8L7 10L11 6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="24" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Official Business Broadcast</text>
      </g>

      <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">
        Hello {{1}}, your exclusive VIP access is ready! ⚡
      </text>
      
      <!-- Action Button Pill -->
      <g transform="translate(14, 80)">
        <rect width="312" height="34" rx="8" fill="#059669" fill-opacity="0.8" />
        <text x="156" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">
          Claim Access Now →
        </text>
      </g>
    </g>
  </g>
</svg>

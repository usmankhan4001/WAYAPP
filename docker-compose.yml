version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wayapp-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wayapp}
      POSTGRES_USER: ${POSTGRES_USER:-wayapp}
      # 2026-09 containment: no default password. The old hardcoded fallback meant a
      # deployment that forgot the variable booted with a publicly known credential.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment}
    ports:
      - '127.0.0.1:5432:5432' # Bind to localhost only for security
    volumes:
      - pg_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wayapp} -d ${POSTGRES_DB:-wayapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wayapp-web
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      # 2026-09 containment: DATABASE_URL and AUTH_SECRET are required — the old
      # hardcoded fallback AUTH_SECRET was a publicly known JWT signing/encryption key.
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL in the environment}
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET (32+ bytes) in the environment}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wayapp-worker
    restart: always
    command: ["npx", "tsx", "src/worker/index.ts"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL in the environment}
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET (32+ bytes) in the environment}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - WORKER_HEALTH_PORT=3001
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
    driver: local
  uploads_data:
    driver: local

name: 💡 Feature Request / Enhancement
description: Suggest a new feature, sales tool, or enhancement for WAYAPP Enterprise
title: "[FEATURE]: "
labels: ["type:feature", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make WAYAPP Enterprise even more powerful and user-friendly? We'd love to hear it!

  - type: input
    id: feature_title
    attributes:
      label: Feature Title
      description: Clear, concise summary of the requested feature
      placeholder: e.g. Add 1-click Tap Payments link generator in live chat
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Module Category
      options:
        - Sales AI & Co-Pilot
        - Sales Tools & Lead CRM
        - Campaigns & Broadcasts
        - Automation & Flow Builder
        - Social Channels (IG/Messenger/Telegram)
        - E-Commerce & Payment Gateways
        - Developer API & Webhooks
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: What problem does this solve for your sales or operations team?
      placeholder: Our sales team spends time manually copying payment links from another tab...
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution & UX
      description: How should this feature work from the user's perspective?
      placeholder: A button in the sales action bar that generates Tap payment links directly in chat.
    validations:
      required: true

version: '3.8'

services:
  whatsapp-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-platform
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
      - PORT=3000
    volumes:
      # Persistent volume for SQLite database storage
      - whatsapp_data:/app/prisma

volumes:
  whatsapp_data:
    driver: local
